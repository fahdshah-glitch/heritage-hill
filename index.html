<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heritage Hotel — 3D walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --panel: rgba(248,244,236,.82);
  --panel-line: rgba(59,38,24,.18);
  --ink: #2a1d14;
  --ink-soft: #6d5a4a;
  --brass: #a87b3f;
  --brass-ink: #fff8ec;
  --stage: #d9cbb8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel: rgba(22,17,13,.72);
    --panel-line: rgba(200,159,95,.25);
    --ink: #f3e9da;
    --ink-soft: #b9a68f;
    --brass: #c89f5f;
    --brass-ink: #1b130d;
    --stage: #0e1726;
  }
}
:root[data-theme="dark"]{
  --panel: rgba(22,17,13,.72);
  --panel-line: rgba(200,159,95,.25);
  --ink: #f3e9da;
  --ink-soft: #b9a68f;
  --brass: #c89f5f;
  --brass-ink: #1b130d;
  --stage: #0e1726;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
html,body{ height:100%; margin:0; }
body{ background: var(--stage); color: var(--ink); font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; -webkit-tap-highlight-color: transparent; }
#stage{ position:fixed; inset:0; }
#stage canvas{ display:block; width:100%; height:100%; touch-action:none; }

.top{ position:fixed; top:0; left:0; right:0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 0; display:flex; gap:10px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; pointer-events:none; }
.brand{ pointer-events:auto; display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--panel-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding:8px 14px 8px 8px; border-radius: 4px 18px 18px 4px; }
.mark{ width:36px; height:36px; display:grid; place-items:center; font-family:"Bodoni Moda", Didot, "Times New Roman", serif; font-size:26px; line-height:1; color:var(--brass-ink); background:var(--brass); border-radius:3px; }
.brand .t{ font-family:"Bodoni Moda", Didot, "Times New Roman", serif; font-size:17px; letter-spacing:.01em; }
.brand .s{ font-size:12px; color:var(--ink-soft); margin-top:1px; }

.seg{ pointer-events:auto; display:flex; background:var(--panel); border:1px solid var(--panel-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius:999px; padding:3px; }
.seg button{ appearance:none; border:0; background:transparent; color:var(--ink); font: 500 13px/1 "Figtree", system-ui, sans-serif; padding:9px 13px; border-radius:999px; cursor:pointer; }
.seg button.on{ background:var(--brass); color:var(--brass-ink); }

.bottom{ position:fixed; left:0; right:0; bottom:0; padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 12px); pointer-events:none; }
.views{ pointer-events:auto; display:flex; gap:8px; overflow-x:auto; padding: 4px 14px; scrollbar-width:none; }
.views::-webkit-scrollbar{ display:none; }
.views button{ flex:0 0 auto; appearance:none; cursor:pointer; background:var(--panel); color:var(--ink); border:1px solid var(--panel-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font: 500 13px/1 "Figtree", system-ui, sans-serif; padding:10px 14px; border-radius:6px; }
.views button.on{ border-color: var(--brass); box-shadow: inset 0 -2px 0 var(--brass); }
button:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

.stack{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none; }
.bottom2{ position:fixed; left:0; right:0; bottom:0; padding:0 14px calc(env(safe-area-inset-bottom, 0px) + 14px); pointer-events:none; }
.walkbar{ display:flex; gap:8px; flex-wrap:wrap; }
.walkbar .runchip{ pointer-events:auto; cursor:pointer; font:inherit; color:var(--ink); }
.walkbar .runchip.on{ background:var(--brass); color:var(--brass-ink); border-color:transparent; }
#wx{ flex-wrap:wrap; justify-content:flex-end; }
.walkbar[hidden], .views[hidden]{ display:none; }
.chip{ background:var(--panel); border:1px solid var(--panel-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding:9px 13px; border-radius:6px; font-size:13px; font-weight:500; }
.chip.key.has{ background:var(--brass); color:var(--brass-ink); border-color:transparent; }
#act{ position:fixed; right:14px; bottom:calc(env(safe-area-inset-bottom, 0px) + 66px); appearance:none; border:0; cursor:pointer; background:var(--brass); color:var(--brass-ink); font:600 15px/1.2 "Figtree", system-ui, sans-serif; padding:15px 20px; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.25); max-width:70vw; }
#act[hidden]{ display:none; }
#joy{ position:fixed; width:110px; height:110px; border-radius:50%; border:2px solid rgba(255,255,255,.55); background:rgba(0,0,0,.12); display:none; pointer-events:none; }
#joy.on{ display:block; }
#knob{ position:absolute; left:33px; top:33px; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.75); }
#toast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 150px); transform:translate(-50%,-8px); width:min(440px, calc(100% - 28px)); box-sizing:border-box; background:var(--panel); border:1px solid var(--panel-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding:12px 15px; border-radius:8px; font-size:14px; line-height:1.45; opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; }
#toast.show{ opacity:1; transform:translate(-50%,0); }
#fade{ position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .3s; z-index:4; }
#fade.on{ opacity:1; }
#modal{ position:fixed; inset:0; display:grid; place-items:center; background:rgba(10,7,4,.45); z-index:6; padding:18px; }
#modal[hidden]{ display:none; }
#modal .card{ width:min(460px,100%); max-height:80vh; overflow:auto; background:var(--panel); border:1px solid var(--panel-line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius:10px; padding:18px; box-sizing:border-box; }
#modal h2{ font:500 22px/1.2 "Bodoni Moda", Didot, Georgia, serif; margin:0 0 8px; }
.m-note{ font-size:14px; line-height:1.5; color:var(--ink-soft); margin:0 0 14px; }
.m-list{ display:flex; flex-direction:column; gap:8px; }
.m-list button, .m-grid button, .m-close{ appearance:none; cursor:pointer; font:500 14px/1.3 "Figtree", system-ui, sans-serif; color:var(--ink); background:transparent; border:1px solid var(--panel-line); border-radius:8px; text-align:left; }
.m-list button{ display:flex; gap:14px; align-items:center; padding:12px; }
.m-list .n{ font:500 22px/1 "Bodoni Moda", Didot, Georgia, serif; color:var(--brass); min-width:64px; }
.m-list small, .m-grid small{ display:block; color:var(--ink-soft); font-size:12px; margin-top:2px; }
.m-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.m-grid button{ padding:10px 6px; text-align:center; }
.m-grid b{ font:500 19px/1 "Bodoni Moda", Didot, Georgia, serif; }
.m-grid button.cur{ border-color:var(--brass); box-shadow: inset 0 -2px 0 var(--brass); }
.m-grid button.mine{ background:var(--brass); color:var(--brass-ink); }
.m-grid button.mine small{ color:var(--brass-ink); }
.m-close{ margin-top:12px; width:100%; padding:11px; text-align:center; }
#waterfx{ position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .5s; background:linear-gradient(to top, rgba(40,140,170,.38), rgba(40,140,170,0) 45%); } #waterfx.on{ opacity:1; }
#loader{ position:fixed; inset:0; display:grid; place-items:center; background:var(--stage); color:var(--ink); font-family:"Bodoni Moda", Didot, serif; font-size:20px; transition: opacity .6s ease; z-index:5; text-align:center; padding:24px; }
#loader.gone{ opacity:0; pointer-events:none; }
#loader small{ display:block; font-family:"Figtree", system-ui, sans-serif; font-size:13px; color:var(--ink-soft); margin-top:8px; }
@media (prefers-reduced-motion: reduce){ #loader{ transition:none; } }
</style>
</head>
<body>
<div id="stage"></div>

<div class="top">
  <div class="brand">
    <div class="mark">H</div>
    <div><div class="t">Heritage Hotel</div><div class="s" id="hint">Drag to orbit · pinch or scroll to zoom</div></div>
  </div>
  <div class="stack">
  <div class="seg" id="nav" role="group" aria-label="Mode"><button data-n="explore" class="on">Explore</button><button data-n="walk">Walk inside</button></div>
  <div class="seg" id="modes" role="group" aria-label="Time of day">
    <button data-m="day">Day</button>
    <button data-m="golden" class="on">Golden hour</button>
    <button data-m="night">Night</button>
  </div>
  <div class="seg" id="ppl" role="group" aria-label="Guests and sound"><button id="shuffle">Shuffle guests</button><button id="snd">Sound: on</button><button id="mus">Music: on</button></div>
  <div class="seg" id="wx" role="group" aria-label="Weather"><button data-w="auto" class="on">Auto</button><button data-w="clear">Clear</button><button data-w="cloudy">Cloudy</button><button data-w="rain">Rain</button><button data-w="storm">Storm</button><button data-w="snow">Snow</button><button data-w="fog">Fog</button></div>
  </div>
</div>

<div class="bottom">
  <div class="views" id="views" role="group" aria-label="Camera views">
    <button data-v="hero" class="on">Approach</button>
    <button data-v="aerial">Aerial</button>
    <button data-v="entrance">Entrance</button>
    <button data-v="lobby">Lobby</button>
    <button data-v="library">Library</button>
    <button data-v="restaurant">Restaurant</button>
    <button data-v="lounge">Lounge</button>
    <button data-v="roof">Rooftop pool</button>
    <button data-v="rear">Garden side</button>
    <button data-v="bridge">Sky bridge</button>
    <button data-v="park">Theme park</button>
    <button data-v="water">Water park</button>
    <button data-v="town">Town</button>
  </div>
</div>

<div class="bottom2"><div class="walkbar" id="walkbar" hidden><span class="chip" id="loc">Hotel grounds</span><span class="chip key" id="keychip">No room key yet</span><button class="chip runchip" id="runchip" aria-pressed="false">Walking</button></div></div>
<button id="act" hidden></button>
<div id="joy"><div id="knob"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fade"></div>
<div id="modal" hidden><div class="card" role="dialog" aria-modal="true"><div id="mbody"></div></div></div>
<div id="waterfx"></div>
<div id="loader">Building Heritage Hotel<small>Generating facades, interiors and landscape</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
<script>
(function(){
const loader = document.getElementById('loader');
function fail(msg){ loader.innerHTML = 'The 3D scene could not start<small>'+msg+'</small>'; }
if(!window.THREE || !THREE.OrbitControls){ fail('The 3D library did not load. Check your connection and reload the page.'); return; }
try { main(); } catch(e){ console.error(e); fail('WebGL error: '+e.message); }

function main(){
const isMobile = Math.min(innerWidth, innerHeight) < 700;
let seed = 1337;
function rng(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
const R=(a,b)=>a+(b-a)*rng();
const PI=Math.PI;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isMobile?1.75:2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.getElementById('stage').appendChild(renderer.domElement);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe0b291, 280, 1600);
const camera = new THREE.PerspectiveCamera(isMobile?55:45, innerWidth/innerHeight, 0.3, 6000);
camera.position.set(-105, 16, 150);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 38, 0);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.maxPolarAngle = PI*.495; controls.minDistance = .8; controls.maxDistance = 800;

/* ---------- helpers ---------- */
const regs = [];     // emissive materials by category
const plights = [];  // point lights by category
function reg(mat,cat,base){ regs.push({mat,cat,base}); return mat; }
function std(o){ return new THREE.MeshStandardMaterial(o); }
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(c, o){ o=o||{}; const t=new THREE.CanvasTexture(c); if(o.srgb!==false) t.encoding=THREE.sRGBEncoding; t.wrapS=t.wrapT=THREE.RepeatWrapping; if(o.rep) t.repeat.set(o.rep[0],o.rep[1]); t.anisotropy=ANISO; return t; }
function repMat(c, w, h, tile, opts){ return std(Object.assign({map:tex(c,{rep:[w/tile,h/tile]})}, opts||{})); }
function addBox(w,h,d,mat,x,y,z,parent,cast){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=cast!==false; m.receiveShadow=true; (parent||scene).add(m); return m; }
function addCyl(rt,rb,h,mat,x,y,z,seg,parent){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; (parent||scene).add(m); return m; }
function flat(w,d,mat,x,z,y){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat); m.rotation.x=-PI/2; m.position.set(x,y||0.02,z); m.receiveShadow=true; scene.add(m); return m; }
const _o = new THREE.Object3D();
function mtx(x,y,z,sx,sy,sz,ry,rx,rz){ _o.position.set(x,y,z); _o.rotation.set(rx||0,ry||0,rz||0); _o.scale.set(sx===undefined?1:sx, sy===undefined?1:sy, sz===undefined?1:sz); _o.updateMatrix(); return _o.matrix.clone(); }
function instanced(geo, mat, list, colors, cast){ if(!list.length) return null; const im=new THREE.InstancedMesh(geo,mat,list.length); list.forEach((m,i)=>im.setMatrixAt(i,m)); if(colors){ colors.forEach((c,i)=>im.setColorAt(i,c)); im.instanceColor.needsUpdate=true; } im.castShadow=cast!==false; im.receiveShadow=true; scene.add(im); return im; }
const COL={G:[],P:[],S:[]};
function cB(arr,x,z,w,d){ arr.push({b:1,x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2}); }
function cC(arr,x,z,r){ arr.push({b:0,x,z,r}); }
var SEATS=[], TABLES=[], LAMPS=[], ZMESH=[]; function ZM(z,m){ if(m) ZMESH.push({z,m,on:m.material}); return m; }
function pLight(color, base, dist, x,y,z, cat){ const l=new THREE.PointLight(color, base, dist, 1.6); l.position.set(x,y,z); scene.add(l); plights.push({l,cat,base}); return l; }

/* ---------- procedural textures ---------- */
function noiseCanvas(size, base, spread, count, rmin, rmax){
  const c=makeCanvas(size,size), g=c.getContext('2d'); g.fillStyle=base; g.fillRect(0,0,size,size);
  for(let i=0;i<count;i++){ const v=R(-spread,spread); g.fillStyle = v>0 ? `rgba(255,255,255,${v})` : `rgba(0,0,0,${-v})`; const r=R(rmin,rmax); g.fillRect(R(0,size),R(0,size),r,r); }
  return c;
}
function grassCanvas(){
  const c=makeCanvas(256,256), g=c.getContext('2d'); g.fillStyle='#4a6531'; g.fillRect(0,0,256,256);
  for(let i=0;i<5000;i++){ const h=R(75,105), s=R(30,55), l=R(18,38); g.strokeStyle=`hsla(${h},${s}%,${l}%,.55)`; g.lineWidth=R(.6,1.4); const x=R(0,256), y=R(0,256); g.beginPath(); g.moveTo(x,y); g.lineTo(x+R(-2,2), y-R(2,6)); g.stroke(); }
  for(let i=0;i<40;i++){ g.fillStyle=`rgba(${rng()<.5?'40,30,10':'120,140,60'},${R(.04,.1)})`; g.beginPath(); g.arc(R(0,256),R(0,256),R(10,40),0,7); g.fill(); }
  return c;
}
function pavingCanvas(base, joint, tilePx, cols){
  const s=tilePx*cols, c=makeCanvas(s,s), g=c.getContext('2d'); g.fillStyle=joint; g.fillRect(0,0,s,s);
  for(let i=0;i<cols;i++) for(let j=0;j<cols;j++){ const v=R(-14,14); const b=base.map(x=>Math.max(0,Math.min(255,x+v))|0); g.fillStyle=`rgb(${b})`; g.fillRect(i*tilePx+1,j*tilePx+1,tilePx-2,tilePx-2);
    for(let k=0;k<30;k++){ g.fillStyle=`rgba(0,0,0,${R(0,.05)})`; g.fillRect(i*tilePx+R(0,tilePx), j*tilePx+R(0,tilePx), 2,2);} }
  return c;
}
function streetCanvas(){
  const c=noiseCanvas(512,'#3b3c3e',.06,4000,1,2), g=c.getContext('2d');
  g.fillStyle='#d8b23a'; g.fillRect(0,252,512,4); g.fillRect(0,260,512,4);
  g.fillStyle='#e8e8e8'; g.fillRect(0,20,512,5); g.fillRect(0,487,512,5);
  for(let x=0;x<512;x+=128){ g.fillRect(x,134,64,4); g.fillRect(x,374,64,4); }
  return c;
}
function marbleCanvas(bg, vein, n){
  const S=1024, c=makeCanvas(S,S), g=c.getContext('2d'); g.fillStyle=bg; g.fillRect(0,0,S,S);
  for(let i=0;i<300;i++){ g.fillStyle=`rgba(${vein==='#ffffff'||vein==='#ececec'?'255,255,255':'0,0,0'},${R(0,.03)})`; g.beginPath(); g.arc(R(0,S),R(0,S),R(20,140),0,7); g.fill(); }
  g.lineCap='round'; g.strokeStyle=vein;
  for(let i=0;i<n;i++){ let x=R(0,S), y=R(0,S), a=R(0,6.28); g.globalAlpha=R(.12,.75); g.lineWidth=R(.5,2.6); g.beginPath(); g.moveTo(x,y); const st=R(8,26)|0; for(let k=0;k<st;k++){ a+=R(-.55,.55); x+=Math.cos(a)*R(14,46); y+=Math.sin(a)*R(14,46); g.lineTo(x,y);} g.stroke(); }
  g.globalAlpha=1; return c;
}
function woodCanvas(base){
  const S=512, c=makeCanvas(S,S), g=c.getContext('2d'); g.fillStyle=base; g.fillRect(0,0,S,S);
  const ph=64;
  for(let p=0;p<S/ph;p++){
    const y=p*ph; g.fillStyle = rng()<.5 ? `rgba(0,0,0,${R(0,.18)})` : `rgba(255,240,220,${R(0,.07)})`; g.fillRect(0,y,S,ph);
    for(let k=0;k<26;k++){ g.strokeStyle=`rgba(0,0,0,${R(.04,.16)})`; g.lineWidth=R(.5,1.5); const yy=y+R(2,ph-2); g.beginPath(); g.moveTo(0,yy); for(let x=0;x<=S;x+=32) g.lineTo(x, yy+Math.sin(x*.02+k)*R(.5,2.2)); g.stroke(); }
    g.fillStyle='rgba(0,0,0,.45)'; g.fillRect(0,y,S,1.5); g.fillRect(R(40,S-40)|0,y,1.5,ph);
  }
  return c;
}
function haloCanvas(){ const c=makeCanvas(128,128), g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,255,255,.45)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); return c; }

/* ---------- see-through glass: interior mapping draws a real room behind every pane (walls, floor, ceiling, bed, art, curtains),
   naturally lit by warm ceiling lamps that switch on and off over time; reflections only at grazing angles ---------- */
const IM=(function(){ const u={imLight:{value:.5},imTime:{value:0}};
  const head=`
uniform float imLight; uniform float imTime; uniform vec2 imGrid; uniform vec3 imSize; varying vec3 vIMv; varying vec3 vIMn;
float imH(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
vec3 imRoom(vec2 uv, out float litOut){
  vec2 cell=uv*imGrid, id=floor(cell), f=fract(cell); float h1=imH(id), h2=imH(id+7.3), h3=imH(id+13.1), h4=imH(id+29.7), h5=imH(id+41.9);
  vec3 V=normalize(vIMv), N=normalize(vIMn), T=normalize(cross(vec3(0.,1.,0.),N));
  vec3 d=vec3(dot(V,T)/imSize.x, V.y/imSize.y, -dot(V,N)/imSize.z); if(abs(d.x)<1e-4) d.x=1e-4; if(abs(d.y)<1e-4) d.y=1e-4; d.z=max(d.z,1e-4);

  // room state: lit rooms come and go over time; more at night

/* --- placement --- */
const hitAny=(arr,x,z,r)=>arr.some(c=>c.b?(x>c.x0-r&&x<c.x1+r&&z>c.z0-r&&z<c.z1+r):Math.hypot(x-c.x,z-c.z)<c.r+r);
function freeSpot(x,z,lv){ const arr=COL[lv]||COL.G; if(!hitAny(arr,x,z,.3)) return [x,z];
  for(let d=.4;d<=2.4;d+=.4) for(let a=0;a<PI*2;a+=PI/6){ const nx=x+Math.cos(a)*d, nz=z+Math.sin(a)*d; if(!hitAny(arr,nx,nz,.3)) return [nx,nz]; } return [x,z]; }
const indoor=(x,z)=>!!zoneOf(x,z);

function spawn(sp){
  const s=makeSim(sp), p=Object.assign(s,{sp,act:sp.act,phase:rnd()*PI*2,t:rnd()*50,off:rnd()*10,look:0,lookT:0,lookN:0,speed:(sp.speed||rr(1.1,1.4))*(s.kid?.85:1)*(s.age==='senior'?.8:1),dir:1,i:1,wait:0,pose:pick(['relaxed','relaxed','clasped','pockets'])});
  p.info.want=pick(WANTS[sp.role==='waiter'?'waiter':sp.role==='doorman'?'doorman':sp.act]||WANTS.idle);
  scene.add(p.root);
  if(sp.path){ p.pts=sp.path.map(([x,z,y])=>new V3(x,y===undefined?(indoor(x,z)?.3:0):y,z)); p.root.position.copy(p.pts[0]); p.wait=rr(0,2); }
  else if(sp.seat){ const S=sp.seat, yaw=S.yaw+PI; p.root.rotation.y=yaw; p.root.position.set(S.x-Math.sin(yaw)*.13,S.y+.07,S.z-Math.cos(yaw)*.13); p.blob.visible=false;
    p.floorY=S.lv==='P'?14.52:(indoor(S.x,S.z)?.3:0); }
  else { const [x,z]=sp.free===false?[sp.x,sp.z]:freeSpot(sp.x,sp.z,sp.lv||'G'); p.root.position.set(x,sp.y!==undefined?sp.y:(sp.lv==='P'?14.52:indoor(x,z)?.3:0),z);
    p.root.rotation.y=sp.face?Math.atan2(sp.face[0]-x,sp.face[1]-z):(sp.yaw||0); }

}
function despawn(p){ scene.remove(p.root); p.meshes.forEach(m=>m.geometry.dispose()); }

/* --- animation --- */
function rest(p){ p.hips.position.set(0,p.legL,0); p.hips.rotation.set(0,0,0); p.spine.rotation.set(0,0,0); p.neck.rotation.set(0,0,0); p.head.rotation.set(0,0,0);
