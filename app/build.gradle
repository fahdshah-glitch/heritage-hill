plugins { id 'com.android.application' }
def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
android {
    namespace 'com.fahd.heritagehill'
    compileSdk 34
    defaultConfig {
        applicationId 'com.syedfahd.heritagehill'
        minSdk 24
        targetSdk 34
        versionCode 100 + runNo
        versionName "1.2." + runNo
    }
    // one fixed signing key, so every new APK installs as an update over the previous one
    signingConfigs {
        fixed {
            storeFile file('heritage-hill.jks')
            storePassword 'heritagehill'
            keyAlias 'heritagehill'
            keyPassword 'heritagehill'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'html', 'js' }
}
